# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Deploy mdBook site to Pages

on:
  # Runs on pushes targeting the publish-book branch
  push:
    branches: ["publish-book"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
      MDBOOK_PDF_VERSION: 0.1.13
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
          cargo install --version ${MDBOOK_PDF_VERSION} mdbook-pdf --features fetch
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Stamp cover with revision and build date
        run: |
          # jj writes the change id into a `change-id` git header, so we can
          # recover it here without jj installed. Show the 8-char change id
          # (what most readers use) next to the short git hash.
          GIT_SHORT="${GITHUB_SHA::7}"
          JJ_CHANGE=$(git cat-file commit "${GITHUB_SHA}" | sed -n 's/^change-id //p' | cut -c1-8)
          if [ -n "${JJ_CHANGE}" ]; then REV="${JJ_CHANGE} / ${GIT_SHORT}"; else REV="${GIT_SHORT}"; fi
          # Single-source the jj version from the install chapter's pinned command.
          JJ_VERSION=$(grep -oE 'jj-cli@[0-9]+\.[0-9]+\.[0-9]+' src/hello-world/how-to-install.md | head -1 | cut -d@ -f2)
          sed -i "s|__BUILD_JJ_VERSION__|${JJ_VERSION}|" src/cover.md
          sed -i "s|__BUILD_COMMIT__|${REV}|" src/cover.md
          sed -i "s/__BUILD_DATE__/$(date -u +%Y-%m-%d)/" src/cover.md
      - name: Build with mdBook
        run: mdbook build
      - name: Add PDF download to the site
        run: cp book/pdf/output.pdf book/html/jujutsu-tutorial.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/html
      - name: Upload PDF for the release job
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: book/html/jujutsu-tutorial.pdf

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publish the PDF as a rolling "latest" release
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf
      - name: Publish PDF to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest PDF build
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: jujutsu-tutorial.pdf
